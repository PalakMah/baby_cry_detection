# Data
data_dir: "data/cry_images"      # ImageFolder-style directory of spectrogram images
checkpoint_dir: "results/checkpoints"
encoder_checkpoint: "results/checkpoints/simclr_encoder.pt"

# SimCLR pretraining
batch_size: 32
lr: 0.001
epochs: 50
temperature: 0.5

# 5-fold CV finetuning
k_folds: 5
finetune_epochs: 10
seed: 42
